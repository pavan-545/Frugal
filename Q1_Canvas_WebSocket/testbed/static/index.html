<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic HTML5 Canvas Testbed - Q1</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #38bdf8;
        }
        .status-panel {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            background: #1e293b;
            padding: 12px 24px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .status-item {
            font-size: 0.95rem;
        }
        .status-val {
            font-weight: bold;
            color: #a855f7;
        }
        #canvas-container {
            position: relative;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #334155;
        }
        canvas {
            display: block;
            background-color: #1e293b;
            cursor: crosshair;
        }
        /* Structured Error Boundary Element */
        .error-boundary {
            margin-top: 15px;
            width: 800px;
            padding: 15px 20px;
            background-color: #450a0a;
            border: 2px solid #ef4444;
            color: #fca5a5;
            border-radius: 8px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .hidden {
            display: none !important;
        }
        .success-banner {
            margin-top: 15px;
            width: 800px;
            padding: 12px 20px;
            background-color: #064e3b;
            border: 2px solid #10b981;
            color: #6ee7b7;
            border-radius: 8px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>
    <h1>Dynamic Canvas & WebSocket Stream Testbed</h1>
    
    <div class="status-panel">
        <div class="status-item">WS State: <span id="ws-status" class="status-val">CONNECTING</span></div>
        <div class="status-item">App State: <span id="app-state" class="status-val">INITIALIZING</span></div>
        <div class="status-item">Balance: <span id="app-balance" class="status-val">1000.00</span></div>
        <div class="status-item">Interaction: <span id="interaction-status" class="status-val">WAITING</span></div>
    </div>

    <div id="canvas-container">
        <canvas id="app-canvas" width="800" height="600"></canvas>
    </div>

    <!-- Structured Validation / Error Boundary Element -->
    <div id="error-boundary" class="error-boundary hidden">
        <span style="font-size: 1.2rem;">⚠️</span>
        <span id="error-message">BOUNDARY EXCEPTION: Corrupted WebSocket data packet rejected.</span>
    </div>

    <div id="success-banner" class="success-banner hidden">
        <span style="font-size: 1.2rem;">✅</span>
        <span id="success-message">Chained Interaction Verified: Hover -> Drag 15px X -> Click SUCCESS!</span>
    </div>

    <script src="/static/canvas.js"></script>
</body>
</html>
